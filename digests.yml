name: Digests

on:
  schedule:
    - cron: "*/15 * * * *"        # checks every 15 min; each digest runs at its own time
  workflow_dispatch:
    inputs:
      force:
        description: "Digest id(s) to run now (comma-separated) or 'all'"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["digests.json", "index.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Produce due digests
        run: python scripts/build_digests.py --force "${{ github.event.inputs.force }}"

      - name: Commit results
        id: commit
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Digests $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
